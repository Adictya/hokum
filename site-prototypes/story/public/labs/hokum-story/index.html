<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hokum — notifications for Wayland</title>
<meta name="description" content="Notifications for Wayland that look like they belong on a computer from this decade.">
<meta name="theme-color" content="#1b1b2e">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wall" aria-hidden="true"><div class="stars"></div></div>

<header class="bar" aria-hidden="true">
  <div class="ws"><i class="on"></i><i></i><i></i></div>
  <div class="clock" id="clock"></div>
  <div class="tray">
    <svg viewBox="0 0 16 16"><path d="M1.5 6a9.5 9.5 0 0 1 13 0M3.8 8.6a6.2 6.2 0 0 1 8.4 0M6 11.1a3 3 0 0 1 4 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="13.4" r="1" fill="currentColor"/></svg>
    <svg viewBox="0 0 22 16"><rect x="1" y="4" width="17" height="8" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="3" y="6" width="9" height="4" rx="1" fill="currentColor"/><rect x="19" y="6.5" width="1.6" height="3" rx=".8" fill="currentColor"/></svg>
  </div>
</header>

<main class="stack" id="stack" aria-live="polite" aria-label="Notifications"></main>
<div class="more" id="more" aria-hidden="true"></div>



<nav class="controls">
  <button id="skip" type="button">Skip</button>
  <button id="replay" type="button">Replay</button>
</nav>

<section class="hero" id="hero">
  <h1><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="6" width="26" height="9" rx="4.5" fill="currentColor" opacity=".4"/><rect x="3" y="17" width="26" height="9" rx="4.5" fill="currentColor"/></svg>hokum</h1>
  <p class="tag">Notifications for Wayland that look like they belong on a computer from this decade.</p>
  <button class="install copy" data-copy="paru -S hokum-bin" title="Copy to clipboard"><span class="p">$</span> paru -S hokum-bin <span class="hint">copy</span></button>
  <p class="alt">
    <a href="https://anoma.ly/release/hokum/desktop/stable/linux-x64-deb">.deb</a>
    <a href="https://anoma.ly/release/hokum/desktop/stable/linux-x64-rpm">.rpm</a>
    <a href="https://anoma.ly/release/hokum/desktop/stable/linux-arm64-deb">arm64 .deb</a>
    <a href="https://anoma.ly/release/hokum/desktop/stable/linux-arm64-rpm">arm64 .rpm</a>
    <a href="https://github.com/anomalyco/hokum">GitHub</a>
  </p>
</section>

<script src="story.js"></script>
<script src="hero.js"></script>
</body>
</html>
